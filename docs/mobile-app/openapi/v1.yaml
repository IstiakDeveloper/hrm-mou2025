openapi: 3.0.3
info:
  title: Mousumi Mobile API
  version: 1.0.0
  description: Versioned JSON API for Flutter Android/iOS clients.
servers:
  - url: /api/v1
paths:
  /auth/staff/login:
    post:
      summary: Staff username/email login
      operationId: loginStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
                device_name: { type: string }
      responses:
        "200":
          description: Token + bootstrap
        "422":
          description: Validation / auth failure envelope
  /auth/branch/login:
    post:
      summary: Branch PIN login
      operationId: loginBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, pin]
              properties:
                branch_id: { type: integer }
                pin: { type: string }
                device_name: { type: string }
      responses:
        "200":
          description: Token + bootstrap
  /auth/branches:
    get:
      summary: Active branches with PIN for chooser
      operationId: listLoginBranches
      responses:
        "200":
          description: Branch list
  /bootstrap:
    get:
      summary: Session bootstrap
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bootstrap payload
        "401":
          description: Unauthenticated
        "423":
          description: Movement fine lock (except allowlisted routes)
  /auth/logout:
    post:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current token revoked
  /auth/logout-all:
    post:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All tokens revoked
  /auth/password:
    post:
      summary: Change password
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Password updated
  /attendance/self/status:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Today status + eligible branches
  /attendance/self/history:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Own attendance history
  /attendance/self/check-in:
    post:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Punch receipt
  /attendance/self/check-out:
    post:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Punch receipt
  /leave/types:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Leave types
  /leave/balances:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Own balances
  /leave/applications/mine:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Own applications
  /leave/applications/pending:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scoped pending reviews
  /leave/applications:
    post:
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created application
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
