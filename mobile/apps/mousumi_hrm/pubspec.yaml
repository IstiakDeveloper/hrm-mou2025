name: mousumi_hrm
description: Mousumi ERP Flutter client for Android and iOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.2
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.2
  design_system:
    path: ../../packages/design_system
  api_client:
    path: ../../packages/api_client
  auth_session:
    path: ../../packages/auth_session
  app_core:
    path: ../../packages/app_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
